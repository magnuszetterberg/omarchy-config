bright_foreground = "#FFFFFF"

hyprland_active_border = "rgba(00E5A8ff) rgba(0A5CC4ff) rgba(00E5A8ff) 45deg"
hyprland_inactive_border = "rgba(0A2A5288)"

red = "#FF2D55"
yellow = "#FFB300"
orange = "#FF7A1F"
green = "#7ED321"
cyan = "#00E5A8"
blue = "#1E90FF"
