# Combitech — bold. Brand values from combitech.com, run at full voltage:
#   #1cb898 CTA teal -> #00E5A8 electric   #004182 navy -> #0A5CC4
#   ground dropped to near-black so the teal has nothing to compete with.

mode = "dark"

accent = "#00E5A8"
selection = "#0A5CC4"
muted = "#2C5C8F"

background = "#000814"
dark_background = "#00040C"
