# [menu] -- the omarchy menu, clipboard and emoji cards.
background                = "#00040C"
background-alpha          = 0.88
text                      = "#DCEBF7"
border                    = "rgba(4DFFD0ff) rgba(0A5CC4ff) rgba(4DFFD0ff) 45deg"
border-alpha              = 1.0
scrim                     = "#000206"
