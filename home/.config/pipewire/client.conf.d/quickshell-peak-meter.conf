## Make the Omarchy audio panel's input meter a real capture stream.
## Quickshell marks it stream.monitor=true, and WirePlumber never switches a
## Bluetooth headset to headset mode for monitor streams, so selecting a BT
## mic in the panel showed a dead meter and left the mic off (A2DP has no mic).
## With this, opening the panel on a BT input switches it to headset mode while
## the panel is open, like any app that records.

stream.rules = [
  {
    matches = [
      { application.name = "Quickshell Peak Detect" }
      { node.name = "quickshell", stream.monitor = "true" }
    ]
    actions = {
      update-props = {
        stream.monitor = false
      }
    }
  }
]
