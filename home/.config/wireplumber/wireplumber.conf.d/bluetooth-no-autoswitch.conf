## Don't flip Bluetooth headsets into HFP/HSP when an app opens the mic.
## The headset stays in A2DP (playback only) and calls use the laptop mic.
## Each A2DP<->HFP switch tears down and recreates the nodes, and the
## SCO link on the Intel adapter kept failing mid-call, leaving browser
## WebRTC streams attached to dead nodes until the tab was reloaded.
## Switch to "Headset Head Unit" manually if the headset mic is needed.

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
